<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <h1>Generate a <span>random password</span></h1>
        <p>Never use an insecure password again.</p>

        <div class="settings-section">
          <div class="setting-group">
            <label for="passwordLength">Password Length:</label>
            <div class="length-input-group">
              <input
                type="range"
                id="passwordLength"
                min="8"
                max="40"
                value="16"
              />
              <span id="lengthValue">16</span>
            </div>
          </div>

          <div class="setting-group">
            <label>Character Types:</label>
            <div class="checkboxes">
              <label class="checkbox-label">
                <input type="checkbox" id="uppercase" checked /> Uppercase
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="lowercase" checked /> Lowercase
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="numbers" checked /> Numbers
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="symbols" checked /> Symbols
              </label>
            </div>
          </div>
        </div>

        <button id="myButton">Generate passwords</button>
      </div>
      <hr />

      <div class="strength-indicator">
        <div class="strength-bar" id="strengthBar"></div>
        <p class="strength-text" id="strengthText"></p>
      </div>

      <div class="generate-fields">
        <div class="password-container">
          <div class="rectangle">
            <p id="gen1" class="password-text">Generate 1</p>
          </div>
          <button class="copy-btn" data-target="gen1" title="Copy to clipboard">
            📋 Copy
          </button>
        </div>
        <div class="password-container">
          <div class="rectangle">
            <p id="gen2" class="password-text">Generate 2</p>
          </div>
          <button class="copy-btn" data-target="gen2" title="Copy to clipboard">
            📋 Copy
          </button>
        </div>
      </div>

      <div class="notification" id="notification"></div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
